<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>doubbt2's GitHub Pages</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #58a6ff;
    }

    p {
      font-size: 1.125rem;
      color: #8b949e;
      margin-bottom: 2rem;
    }

    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background-color: #238636;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    a:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>👋 Hello, World!</h1>
    <p>Welcome to doubbt2's GitHub Pages site.</p>
    <a href="https://github.com/doubbt2-hash" target="_blank">View my GitHub Profile</a>
  </div>
</body>
</html>
